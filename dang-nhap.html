<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VCG App Store - Đăng nhập</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page-wrap">
    <main class="auth-page">
      <section class="auth-panel auth-page-panel" aria-labelledby="authTitle">
        <h3 id="authTitle">Đăng nhập</h3>
        <p class="auth-sub">Vui lòng nhập email và mật khẩu của bạn.</p>
        <form onsubmit="return submitAuth(event)">
          <div id="register-fields">
            <label class="auth-label" for="name">Họ tên</label>
            <input id="name" placeholder="Họ tên">
            <label class="auth-label" for="birth">Ngày sinh</label>
            <input id="birth" type="date">
            <label class="auth-label" for="gender">Giới tính</label>
            <select id="gender">
              <option value="">Chọn giới tính</option>
              <option>Nam</option>
              <option>Nữ</option>
            </select>
            <label class="auth-label" for="nickname">Gọi tôi là</label>
            <input id="nickname" placeholder="Gọi tôi là...">
          </div>
          <label class="auth-label" for="auth-email">Email</label>
          <input id="auth-email" type="email" required>
          <label class="auth-label" for="auth-password">Mật khẩu</label>
          <input id="auth-password" type="password" required>
          <label class="auth-label" for="auth-repassword" id="auth-repassword-label">Nhập lại mật khẩu</label>
          <input id="auth-repassword" type="password">
          <button class="auth-submit" type="submit" id="authSubmit">Đăng nhập</button>
        </form>
        <div class="auth-switch">
          <button type="button" onclick="setAuthMode('login')">Đăng nhập</button>
          <button type="button" onclick="setAuthMode('register')">Đăng ký</button>
        </div>
      </section>
    </main>

  </div>

  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCygeMWanp1LjJUD9B_ls6Z6nKZE4Bw7og",
    authDomain: "vcg-store.firebaseapp.com",
    projectId: "vcg-store",
    storageBucket: "vcg-store.firebasestorage.app",
    messagingSenderId: "889034854707",
    appId: "1:889034854707:web:07de19e5f9194ac6d12e46"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentMode = "login";

  window.logout = function() {
    signOut(auth).catch(err => alert(err.message));
  }

  window.setAuthMode = function(mode) {
    currentMode = mode === "register" ? "register" : "login";
    const isRegister = currentMode === "register";
    const title = document.getElementById("authTitle");
    const submit = document.getElementById("authSubmit");
    const registerFields = document.getElementById("register-fields");
    const repassword = document.getElementById("auth-repassword");
    const repasswordLabel = document.getElementById("auth-repassword-label");

    document.title = `VCG App Store - ${isRegister ? "Đăng ký" : "Đăng nhập"}`;
    if (title) title.textContent = isRegister ? "Đăng ký" : "Đăng nhập";
    if (submit) submit.textContent = isRegister ? "Đăng ký" : "Đăng nhập";
    if (registerFields) registerFields.style.display = isRegister ? "block" : "none";
    if (repassword) {
      repassword.required = isRegister;
      repassword.style.display = isRegister ? "block" : "none";
    }
    if (repasswordLabel) repasswordLabel.style.display = isRegister ? "block" : "none";

    const params = new URLSearchParams(window.location.search);
    params.set("mode", currentMode);
    history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
  }

  async function updateAuthUI(user) {
    const userEl = document.getElementById("authAvatar");
    const logoutBtn = document.getElementById("authMenu");
    const greetingEl = document.getElementById("authGreeting");
    const fullNameEl = document.getElementById("authFullName");

    if (user) {
      if (logoutBtn) logoutBtn.style.display = "inline-flex";

      let nickname = "";
      let fullName = "";
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          const data = snap.data();
          nickname = data.nickname || "";
          fullName = data.name || "";
        }
      } catch (e) {}

      const displayName = nickname || user.displayName || "";
      const showName = displayName || fullName || user.email || "bạn";

      if (greetingEl) {
        greetingEl.textContent = `Xin chào ${showName}`;
        greetingEl.style.display = "inline-flex";
      }

      if (userEl) {
        const initial = showName.trim().charAt(0).toUpperCase() || "U";
        userEl.textContent = initial;
        userEl.title = user.email || showName;
        userEl.style.display = "inline-flex";
      }

      if (fullNameEl) {
        const label = fullName || user.displayName || "";
        fullNameEl.textContent = label ? `Họ và tên: ${label}` : "Họ và tên: (chưa cập nhật)";
      }
    } else {
      if (logoutBtn) logoutBtn.style.display = "none";
      if (userEl) userEl.style.display = "none";
      if (greetingEl) greetingEl.style.display = "none";
      if (fullNameEl) fullNameEl.textContent = "";
    }
  }

  onAuthStateChanged(auth, updateAuthUI);

  window.toggleMenu = function() {
    const menu = document.getElementById("authMenu");
    const btn = document.getElementById("authAvatar");
    if (!menu || !btn) return;
    const isOpen = menu.classList.toggle("is-open");
    btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  window.openAccount = function() {
    alert("Tính năng tài khoản/cài đặt đang được cập nhật.");
  }

  document.addEventListener("click", (e) => {
    const menu = document.getElementById("authMenu");
    const btn = document.getElementById("authAvatar");
    if (!menu || !btn) return;
    if (menu.contains(e.target)) return;
    menu.classList.remove("is-open");
    btn.setAttribute("aria-expanded", "false");
  });

  function collectProfile() {
    return {
      name: document.getElementById("name")?.value || "",
      birth: document.getElementById("birth")?.value || "",
      gender: document.getElementById("gender")?.value || "",
      nickname: document.getElementById("nickname")?.value || ""
    };
  }

  window.register = function() {
    const email = document.getElementById("auth-email")?.value || "";
    const password = document.getElementById("auth-password")?.value || "";
    const repassword = document.getElementById("auth-repassword")?.value || "";
    if (password !== repassword) {
      alert("Mật khẩu nhập lại không khớp");
      return;
    }
    const profile = collectProfile();
    const displayName = profile.nickname || profile.name || "";
    createUserWithEmailAndPassword(auth, email, password)
      .then(async (cred) => {
        if (displayName) {
          await updateProfile(cred.user, { displayName });
        }
        await setDoc(doc(db, "users", cred.user.uid), {
          name: profile.name,
          birth: profile.birth,
          gender: profile.gender,
          nickname: profile.nickname,
          email,
          createdAt: Date.now()
        });
        alert("Đăng ký thành công");
        window.location.href = "index.html";
      })
      .catch(err => {
        if (err.code === "auth/email-already-in-use") {
          alert("Email đã được đăng ký, hãy Đăng nhập!");
          window.setAuthMode("login");
        } else {
          alert(err.message);
        }
      });
  }

  window.login = async function() {
    const email = document.getElementById("auth-email")?.value || "";
    const password = document.getElementById("auth-password")?.value || "";
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, "users", cred.user.uid));
      if (snap.exists()) {
        const data = snap.data();
        alert(`Xin chào ${data.nickname || data.name || "bạn"}!`);
      } else {
        alert("Đăng nhập thành công");
      }
      window.location.href = "index.html";
    } catch (err) {
      alert(err.message);
    }
  }

  window.submitAuth = function(event) {
    event.preventDefault();
    if (currentMode === "register") {
      window.register();
    } else {
      window.login();
    }
    return false;
  }

  const params = new URLSearchParams(window.location.search);
  window.setAuthMode(params.get("mode") || "login");
  document.getElementById("auth-email")?.focus();
  </script>
</body>
</html>
